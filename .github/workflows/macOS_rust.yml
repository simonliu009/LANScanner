# ==============================================================================
# LANScanner GitHub Actions 构建配置
# 支持平台：macOS (Big Sur+)、Windows、Linux
# ==============================================================================
# 
# 使用方法：
# 1. Fork https://github.com/ChickmagnetL/LANScanner 仓库
# 2. 在你 Fork 的仓库中创建文件：.github/workflows/build.yml
# 3. 将本文件内容粘贴进去
# 4. 提交并推送，Actions 会自动运行
#
# 如果只想编译 macOS Big Sur，可以注释掉 windows 和 linux 的 job
# ==============================================================================

name: Build LANScanner

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: macOS 构建（支持 Big Sur 11.x 及以上）
  # ===========================================================================
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS (Big Sur 11 = macos-11, Monterey 12 = macos-12)
          - target: x86_64-apple-darwin
            runner: macos-13          # macOS 13 Ventura (支持 x86_64)
            artifact_suffix: x86_64
          # Apple Silicon macOS
          - target: aarch64-apple-darwin
            runner: macos-14          # macOS 14 Sonoma (Apple Silicon)
            artifact_suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Rust 工具链安装 ----------
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show Rust & system info
        run: |
          echo "=== Rust version ==="
          rustc --version
          echo "=== Cargo version ==="
          cargo --version
          echo "=== macOS version ==="
          sw_vers
          echo "=== Architecture ==="
          uname -m
          echo "=== Xcode CLT ==="
          xcode-select -p

      # ---------- Rust 编译缓存 ----------
      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # ---------- 编译 ----------
      - name: Build LANScanner (release)
        env:
          CARGO_TARGET_DIR: target
          MACOSX_DEPLOYMENT_TARGET: "11.0"   # 最低支持 Big Sur (11.0)
        run: |
          echo "Building for ${{ matrix.target }} with MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}"
          cargo build \
            --locked \
            --release \
            --target ${{ matrix.target }} \
            -p lanscanner-app

      # ---------- 打包 .app bundle ----------
      - name: Package .app bundle
        env:
          ARTIFACT_NAME: "LANScanner"
          APP_BUNDLE_NAME: "LANScanner.app"
          BUNDLE_IDENTIFIER: "com.lanscanner.desktop"
          RELEASE_DIR: "release/macos"
          RESOURCES_BUILD_DIR: "target/macos-resources"
        run: |
          ARTIFACT_PATH="target/${{ matrix.target }}/release/${ARTIFACT_NAME}"
          APP_BUNDLE_PATH="${RELEASE_DIR}/${APP_BUNDLE_NAME}"
          CONTENTS_DIR="${APP_BUNDLE_PATH}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"

          # 读取版本号
          APP_VERSION=$(awk '
            $0 ~ /^\[workspace\.package\]/ { in_section = 1; next }
            in_section && $0 ~ /^\[/ { in_section = 0 }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "App version: ${APP_VERSION}"

          # 从 .ico 中提取 PNG 图标
          mkdir -p "${RESOURCES_BUILD_DIR}"
          python3 - crates/app/assets/lanscanner.ico "${RESOURCES_BUILD_DIR}/LANScanner.png" <<'PY'
          import struct, sys
          from PIL import Image
          source, destination = sys.argv[1], sys.argv[2]
          with open(source, "rb") as f:
              data = f.read()
              _, _, _, _, _, icon_count = struct.unpack_from("<HHHHHH", data, 0)
              best = None
              for i in range(icon_count):
                  offset = 6 + 16 * i
                  w, h, _, _, _, img_offset, img_size = struct.unpack_from("<BBBBII", data, offset)
                  if w == 0: w = 256
                  if h == 0: h = 256
                  score = w * h
                  ico_data = data[img_offset:img_offset + img_size]
                  try:
                      from io import BytesIO
                      img = Image.open(BytesIO(ico_data))
                  except Exception:
                      continue
                  if best is None or score > best[0]:
                      best = (score, img.tobytes("png"))
          if best is None:
              raise SystemExit(f"No embedded PNG image found in {source}")
          with open(destination, "wb") as f:
              f.write(best[1])
          PY

          # 检查是否安装了 Pillow，如果没有则用 sips 替代方案
          if [ $? -ne 0 ]; then
            echo "Pillow not available, using sips-based extraction..."
            # 先用原生 Python 提取
            python3 - crates/app/assets/lanscanner.ico "${RESOURCES_BUILD_DIR}/LANScanner.png" <<'PY2'
          import struct, sys, io, zlib
          source, destination = sys.argv[1], sys.argv[2]
          with open(source, "rb") as f:
              data = f.read()
          _, _, _, _, _, icon_count = struct.unpack_from("<HHHHHH", data, 0)
          best = None
          for i in range(icon_count):
              offset = 6 + 16 * i
              w, h, _, bpp, _, img_offset, img_size = struct.unpack_from("<BBBBII", data, offset)
              if w == 0: w = 256
              if h == 0: h = 256
              if bpp >= 32:
                  ico_data = data[img_offset:img_offset + img_size]
                  if best is None or w * h > best[0]:
                      best = (w * h, ico_data)
          if best:
              with open(destination, "wb") as f:
                  f.write(best[1])
          PY2
          fi

          # 生成 iconset
          ICONSET_DIR="${RESOURCES_BUILD_DIR}/LANScanner.iconset"
          rm -rf "${ICONSET_DIR}"
          mkdir -p "${ICONSET_DIR}"

          BASE_PNG="${RESOURCES_BUILD_DIR}/LANScanner.png"
          for size in 16 32 128 256 512; do
            sips -s format png -z ${size} ${size} "${BASE_PNG}" --out "${ICONSET_DIR}/icon_${size}x${size}.png" >/dev/null 2>&1 || true
            double=$((size * 2))
            sips -s format png -z ${double} ${double} "${BASE_PNG}" --out "${ICONSET_DIR}/icon_${size}x${size}@2x.png" >/dev/null 2>&1 || true
          done

          # 构建 .app bundle 目录结构
          rm -rf "${RELEASE_DIR}"
          mkdir -p "${MACOS_DIR}"
          mkdir -p "${RESOURCES_DIR}"

          cp "${ARTIFACT_PATH}" "${MACOS_DIR}/${ARTIFACT_NAME}"
          chmod +x "${MACOS_DIR}/${ARTIFACT_NAME}"

          # 生成 icns
          if command -v iconutil >/dev/null 2>&1; then
            iconutil -c icns "${ICONSET_DIR}" -o "${RESOURCES_DIR}/LANScanner.icns"
          else
            echo "Warning: iconutil not available, skipping .icns generation"
          fi

          # 生成 Info.plist
          cat > "${CONTENTS_DIR}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${ARTIFACT_NAME}</string>
              <key>CFBundleIconFile</key>
              <string>LANScanner</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_IDENTIFIER}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>${ARTIFACT_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "${CONTENTS_DIR}/Info.plist" >/dev/null 2>&1 || true

          echo "=== App bundle created ==="
          ls -la "${APP_BUNDLE_PATH}"

      # ---------- 压缩为 zip ----------
      - name: Create ZIP archive
        run: |
          cd release/macos
          zip -r -9 "../../LANScanner-macos-${{ matrix.artifact_suffix }}.zip" "LANScanner.app"
          cd ../..
          ls -lh LANScanner-macos-*.zip

      # ---------- 上传构建产物 ----------
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANScanner-macos-${{ matrix.artifact_suffix }}
          path: LANScanner-macos-${{ matrix.artifact_suffix }}.zip
          retention-days: 30

 
  # ===========================================================================
  # Job 2: 创建 GitHub Release（仅在 tag 推送时触发）
  # ===========================================================================
  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip,artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
